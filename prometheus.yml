global:
  scrape_interval: 15s

scrape_configs:
  # Scrape configuration for Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['192.168.56.3:9090']  # Adjust IP/port if necessary

  # Scrape configuration for Jenkins
  - job_name: 'jenkins'
    metrics_path: '/prometheus'  # Change this if your Jenkins uses a different path
    static_configs:
      - targets: ['192.168.56.3:8080']  # Replace with the Jenkins server IP and port
  # Scrape configuration for your Spring Boot application
  - job_name: 'app-ski'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.56.3:8089']
